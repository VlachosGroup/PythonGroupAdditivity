units:
  molar enthalpy: kcal/mol
  molar entropy: cal/(mol*K)
  molar heat capacity: cal/(mol*K)
  temperature: K

# The groups below are entered directly from _Thermochemical Kinetics_ 2nd ed.;
# S.W. Benson; New York: John Wiley & Sons, 1976 pp. 272-273.

groups:
  Double tbCis:
    thermochem:
      T_ref: 298.0
      H_ref: 2.00
      S_ref: null
      Cp_data: []
      range: [298, 1500]

  Ditertiary ether:
    thermochem:
      T_ref: 298.0
      H_ref: 8.4
      S_ref: null
      Cp_data: []
      range: [298, 1500]